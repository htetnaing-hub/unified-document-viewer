spring.application.name=unified-document-viewer

# --- Threads: virtual threads for request handling (blocking I/O without thread-pool sizing) ---
spring.threads.virtual.enabled=true

# --- Source systems (the mocked Sales and Service APIs from compose.yaml) ---
docviewer.sources.sales.base-url=${SALES_API_URL:http://localhost:8081}
docviewer.sources.sales.connect-timeout=500ms
docviewer.sources.sales.timeout=2s
docviewer.sources.service.base-url=${SERVICE_API_URL:http://localhost:8082}
docviewer.sources.service.connect-timeout=500ms
docviewer.sources.service.timeout=2s
docviewer.aggregation.max-concurrent-source-calls=200

# --- Persistence: schema owned by Flyway; Hibernate only validates it ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true

# --- API errors as application/problem+json ---
spring.mvc.problemdetails.enabled=true

# --- Observability ---
# Structured JSON logs (Elastic Common Schema); MDC values such as correlationId, traceId and
# spanId become fields.
logging.structured.format.console=ecs
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
# A failing source degrades the service, it does not make it unhealthy: keep it out of the
# probes so the orchestrator does not restart or de-route healthy instances.
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.status.order=down,out-of-service,degraded,up,unknown
management.endpoint.health.status.http-mapping.degraded=200
# Sample every request locally; lower this in production.
management.tracing.sampling.probability=1.0

# --- API docs ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
